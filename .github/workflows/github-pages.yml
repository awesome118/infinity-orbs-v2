name: Deploy Rift Challenge preview to GitHub Pages

# Static-only preview; the Devvit server remains hosted by Reddit.

on:
  push:
    branches:
      - main
    paths:
      - "pages/**"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Wait for uploaded artifact metadata to become available
        run: sleep 10

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
