name: Deploy Infinity Orbs Pages test build

on:
  push:
    branches:
      - github-pages-test
    paths:
      - .github/pages-deploy-trigger
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pages-test
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out test branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static Pages version
        run: npm run build:pages

      - name: Mark output as a static site
        run: touch dist-pages/.nojekyll

      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

      - name: Deploy test site
        id: deployment
        uses: actions/deploy-pages@v4
