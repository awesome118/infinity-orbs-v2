name: Deploy Infinity Orbs Pages test build

on:
  push:
    branches:
      - github-pages-test
    paths:
      - .github/pages-deploy-trigger
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pages-test
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out test branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and run focused feature tests
        run: |
          npm run type-check
          node --import tsx --test --test-name-pattern="Frenzy owner rewards remain separate|Frenzy claims use a three-per-day limit|Frenzy claims expose a daily allowance|admin self-claim works even when the normal daily claim is already used" tests/frenzy.test.ts
          node --import tsx --test tests/quest-scaling.test.ts tests/offline-frenzy-rewards.test.ts tests/pages-reddit-simulator.test.ts
          node --import tsx --test tests/admin-cli.test.ts tests/rarity-icon-visuals.test.ts tests/admin-save-commands.test.ts tests/roll-batching.test.ts tests/live-balance.test.ts
          node --import tsx --test tests/rift-challenges.test.ts tests/pages-rift-challenges.test.ts
          node --import tsx --test tests/full-log-snapshot.test.ts
          node --import tsx --test --test-name-pattern="third lifetime Orb guarantee is main-game-only" tests/audit-regressions.test.ts

      - name: Build static Pages version
        run: npm run build:pages

      - name: Mark output as a static site
        run: touch dist-pages/.nojekyll

      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy test site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
