name: Validate Infinity Orbs

on:
  push:
    branches:
      - main
      - release/1.2.14-candidate-20261013
  pull_request:
    branches:
      - main
      - release/1.2.14-candidate-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.event_name != 'push' || github.event.head_commit.message != 'DEPLOY-DEV-1.2.49-ONCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run source checks, tests, and production build
        run: npm run preflight
