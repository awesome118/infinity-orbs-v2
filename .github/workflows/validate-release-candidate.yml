name: Validate Infinity Orbs 1.2.14 candidate
# Executes source checks, all tests, and the production build before manual deployment.

on:
  push:
    branches:
      - release/1.2.14-candidate-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source and run full preflight
        run: npm run preflight
