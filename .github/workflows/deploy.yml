name: Deploy Devvit
# Fresh deployment trigger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Guard against invalid Devvit transaction reads
        run: |
          set -euo pipefail
          if grep -R -nE '\b(txn|tx)\.get\(' src; then
            echo "Invalid Devvit transaction read detected. Use redis.get() after WATCH; TxClient.get() is a transaction builder."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Validate Devvit token format
        env:
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DEVVIT_AUTH_TOKEN" || { echo "DEVVIT_TOKEN secret is missing."; exit 1; }
          node <<'NODE'
          const raw = process.env.DEVVIT_AUTH_TOKEN ?? '';
          try {
            const parsed = JSON.parse(raw);
            if (!parsed || typeof parsed !== 'object' || typeof parsed.token !== 'string') {
              throw new Error('missing token field');
            }
            console.log('Devvit auth secret has the expected JSON token format.');
          } catch {
            console.error('DEVVIT_TOKEN must contain the full JSON contents of ~/.devvit/token.');
            process.exit(1);
          }
          NODE

      - name: Verify Devvit authentication
        env:
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
        run: |
          set -euo pipefail
          npx devvit whoami

      - name: Upload to Devvit
        env:
          CI: true
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
        timeout-minutes: 10
        run: timeout --signal=TERM --kill-after=30s 9m npx devvit upload


      - name: Install current build to r/infinity_orbs_dev
        run: |
          set -euo pipefail
          VERSION="$(npx devvit view infinity-orbs version)"
          echo "Installing playtest build infinity-orbs@${VERSION} to r/infinity_orbs_dev"
          npx devvit install r/infinity_orbs_dev "infinity-orbs@${VERSION}"
          npx devvit list installs r/infinity_orbs_dev
