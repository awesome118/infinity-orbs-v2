name: Deploy Devvit

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Guard against invalid Devvit transaction reads
        run: |
          set -euo pipefail
          if grep -R -nE '\\b(txn|tx)\\.get\\(' src; then
            echo "Invalid Devvit transaction read detected. Use redis.get() after WATCH; TxClient.get() is a transaction builder."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Prepare Devvit authentication
        env:
          DEVVIT_TOKEN: ${{ secrets.DEVVIT_AUTH_TOKEN || secrets.DEVVIT_TOKEN }}
          DEVVIT_SESSION_ID: ${{ secrets.DEVVIT_SESSION_ID }}
        run: |
          set -euo pipefail
          if [ -z "${DEVVIT_TOKEN:-}" ]; then
            echo "DEVVIT_AUTH_TOKEN/DEVVIT_TOKEN secret is missing."
            exit 1
          fi
          mkdir -p "$HOME/.devvit"
          printf '%s' "$DEVVIT_TOKEN" > "$HOME/.devvit/token"
          chmod 600 "$HOME/.devvit/token"
          if [ -n "${DEVVIT_SESSION_ID:-}" ]; then
            printf '%s' "$DEVVIT_SESSION_ID" > "$HOME/.devvit/session-id"
            chmod 600 "$HOME/.devvit/session-id"
          fi

      - name: Upload to Devvit
        env:
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_AUTH_TOKEN || secrets.DEVVIT_TOKEN }}
          DEVVIT_SESSION_ID: ${{ secrets.DEVVIT_SESSION_ID }}
          CI: true
        timeout-minutes: 10
        run: timeout --signal=TERM --kill-after=30s 9m npx devvit upload
