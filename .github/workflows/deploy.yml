name: Deploy Devvit

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Guard against invalid Devvit transaction reads
        run: |
          set -euo pipefail
          if grep -R -nE '\b(txn|tx)\.get\(' src; then
            echo "Invalid Devvit transaction read detected. Use redis.get() after WATCH; TxClient.get() is a transaction builder."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Validate Devvit token format
        env:
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const raw = process.env.DEVVIT_AUTH_TOKEN ?? '';
          console.log('DEVVIT_AUTH_TOKEN present:', raw.length > 0);
          console.log('Length:', raw.length);
          try {
            const parsed = JSON.parse(raw);
            const keys = Object.keys(parsed).sort();
            console.log('JSON object:', true);
            console.log('Keys:', keys.join(', '));
            console.log('Contains token field:', typeof parsed.token === 'string' && parsed.token.length > 0);
            console.log('Contains refresh token field:', typeof parsed.refreshToken === 'string' && parsed.refreshToken.length > 0);
          } catch {
            console.log('JSON object:', false);
          }
          NODE

      - name: Verify Devvit authentication
        env:
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
          DEVVIT_SESSION_ID: ${{ secrets.DEVVIT_SESSION_ID }}
        run: |
          set -euo pipefail
          npx devvit whoami

      - name: Upload to Devvit
        env:
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
          DEVVIT_SESSION_ID: ${{ secrets.DEVVIT_SESSION_ID }}
          CI: true
        timeout-minutes: 10
        run: timeout --signal=TERM --kill-after=30s 9m npx devvit upload


      - name: Install current build to r/infinity_orbs_dev
        env:
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
          DEVVIT_SESSION_ID: ${{ secrets.DEVVIT_SESSION_ID }}
        run: |
          set -euo pipefail
          VERSION="$(npx devvit view infinity-orbs version)"
          echo "Installing playtest build infinity-orbs@${VERSION} to r/infinity_orbs_dev"
          npx devvit install r/infinity_orbs_dev "infinity-orbs@${VERSION}"
          npx devvit list installs r/infinity_orbs_dev
