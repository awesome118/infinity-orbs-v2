name: Deploy Devvit

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect Devvit exports
        run: |
          echo '--- notifications package ---'
          cat node_modules/@devvit/notifications/package.json
          echo '--- notifications declarations ---'
          find node_modules/@devvit/notifications -maxdepth 3 -type f | sort | head -80
          echo '--- scheduler package ---'
          cat node_modules/@devvit/scheduler/package.json
          echo '--- scheduler declarations ---'
          find node_modules/@devvit/scheduler -maxdepth 3 -type f | sort | head -80

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Upload to Devvit
        env:
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
          DEVVIT_SESSION_ID: ${{ secrets.DEVVIT_SESSION_ID }}
        run: npx devvit upload
