name: Deploy Devvit

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Guard against invalid Devvit transaction reads
        run: |
          set -euo pipefail
          if grep -R -nE '\b(txn|tx)\.get\(' src; then
            echo "Invalid Devvit transaction read detected. Use redis.get() after WATCH; TxClient.get() is a transaction builder."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Verify Devvit authentication
        env:
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
        run: |
          set -euo pipefail
          npx devvit whoami

      - name: Upload to Devvit
        env:
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
          CI: true
        timeout-minutes: 10
        run: timeout --signal=TERM --kill-after=30s 9m npx devvit upload
