name: Deploy Devvit

# Deliberately manual: pushes should not repeatedly trigger costly deployment attempts.
# This workflow uploads and installs to the development subreddit only. Production install is a separate post-approval workflow.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Must exactly match package.json version (for example 1.2.2)."
        required: true
        type: string
      confirm_install:
        description: "Explicitly authorize upload to Devvit and installation to r/infinity_orbs_dev only."
        required: true
        type: boolean
        default: false

jobs:
  deploy:
    if: ${{ inputs.confirm_install }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require main branch before upload/install
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Refusing side effects from non-main ref: $GITHUB_REF"
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify requested version
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = "$REQUESTED_VERSION" || {
            echo "Version mismatch: package.json is $VERSION but requested $REQUESTED_VERSION."
            exit 1
          }
          echo "Preparing infinity-orbs@$VERSION"

      - name: Deployment preflight
        run: npm run preflight

      - name: Validate Devvit CI token
        env:
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DEVVIT_AUTH_TOKEN" || {
            echo "DEVVIT_TOKEN GitHub secret is missing."
            exit 1
          }
          case "$DEVVIT_AUTH_TOKEN" in
            \{*) ;;
            *)
              echo "DEVVIT_TOKEN must contain the complete JSON blob from ~/.devvit/token, not just the token string."
              exit 1
              ;;
          esac

      - name: Upload to Devvit
        env:
          CI: true
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
        timeout-minutes: 10
        run: timeout --signal=TERM --kill-after=30s 9m npx devvit upload

      - name: Verify uploaded version
        id: uploaded-version
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          VERSION="$(npx devvit view infinity-orbs version)"
          test "$VERSION" = "$REQUESTED_VERSION" || {
            echo "Uploaded Devvit version $VERSION does not match requested $REQUESTED_VERSION."
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install candidate to development subreddit only (r/infinity_orbs_dev)
        env:
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
          VERSION: ${{ steps.uploaded-version.outputs.version }}
        run: |
          set -euo pipefail
          npx devvit install r/infinity_orbs_dev "infinity-orbs@$VERSION"
          npx devvit list installs r/infinity_orbs_dev
