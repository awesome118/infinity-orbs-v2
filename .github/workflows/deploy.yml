name: Deploy Devvit
# Fresh auth retry trigger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Mechanics tests
        run: npm test

      - name: Guard against invalid Devvit transaction reads
        run: |
          set -euo pipefail
          if grep -R -nE '\b(txn|tx)\.get\(' src; then
            echo "Invalid Devvit transaction read detected. Use redis.get() after WATCH; TxClient.get() is a transaction builder."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Configure Devvit authentication
        env:
          DEVVIT_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
          DEVVIT_SESSION_ID: ${{ secrets.DEVVIT_SESSION_ID }}
        run: |
          set -euo pipefail
          test -n "$DEVVIT_TOKEN" || { echo "DEVVIT_TOKEN GitHub secret is missing."; exit 1; }
          mkdir -p "$HOME/.devvit"
          printf '%s' "$DEVVIT_TOKEN" > "$HOME/.devvit/token"
          if [ -n "${DEVVIT_SESSION_ID:-}" ]; then
            printf '%s' "$DEVVIT_SESSION_ID" > "$HOME/.devvit/session-id"
          fi
          chmod 600 "$HOME/.devvit/token" "$HOME/.devvit/session-id" 2>/dev/null || true

      - name: Upload to Devvit
        env:
          CI: true
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
          DEVVIT_SESSION_ID: ${{ secrets.DEVVIT_SESSION_ID }}
        timeout-minutes: 10
        run: timeout --signal=TERM --kill-after=30s 9m npx devvit upload

      - name: Install current build to r/infinity_orbs_dev
        run: |
          set -euo pipefail
          VERSION="$(npx devvit view infinity-orbs version)"
          echo "Installing playtest build infinity-orbs@${VERSION} to r/infinity_orbs_dev"
          npx devvit install r/infinity_orbs_dev "infinity-orbs@${VERSION}"
          npx devvit list installs r/infinity_orbs_dev
