name: Combat and release preflight

on:
  pull_request:
  push:
    branches:
      - feature/combat-wave3-equipped-abilities-20261015
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preflight-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Node 24 preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run preflight (guard, type-check, tests, and production build)
        run: npm run preflight
