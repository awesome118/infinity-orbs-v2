name: Submit Infinity Orbs for Reddit Review

on:
  # Retry 2.0.4 diagnostic release preflight after fixing TypeScript in the Redis save-count callback.
  workflow_run:
    workflows: ["Deploy Devvit"]
    types: [completed]
    branches: [main]

  # Explicitly submit only when a commit is marked for the requested review release.
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml

  workflow_dispatch:
    inputs:
      release_version:
        description: "Must exactly match package.json version."
        required: true
        type: string
      confirm_publish:
        description: "Explicitly authorize submission of this version for Reddit review only. This workflow does not install to any subreddit."
        required: true
        type: boolean
        default: false

jobs:
  release:
    if: ${{ inputs.confirm_publish || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && contains(github.event.workflow_run.head_commit.message, '[submit-review:2.0.4]')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[submit-review:2.0.4]')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require main branch before publishing
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Refusing side effects from non-main ref: $GITHUB_REF"
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify requested release version
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          REQUESTED_VERSION="${REQUESTED_VERSION:-$VERSION}"
          test "$VERSION" = "$REQUESTED_VERSION" || {
            echo "Version mismatch: package.json is $VERSION but requested $REQUESTED_VERSION."
            exit 1
          }
          echo "Preparing infinity-orbs@$VERSION for Reddit review"

      - name: Release preflight
        run: npm run preflight

      - name: Submit version for Reddit review
        env:
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
          CI: true
          DEVVIT_ALLOW_SOURCE_UPLOAD: 1
          REQUESTED_VERSION: ${{ inputs.release_version }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          REQUESTED_VERSION="${REQUESTED_VERSION:-$VERSION}"
          test "$VERSION" = "$REQUESTED_VERSION"
          npx devvit publish --version "$VERSION"

