name: Submit Infinity Orbs for Reddit Review

on:
  # After the explicitly requested development deploy completes successfully, submit the same release for Reddit review.
  workflow_run:
    workflows: ["Deploy Devvit"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      release_version:
        description: "Must exactly match package.json version."
        required: true
        type: string
      confirm_publish:
        description: "Explicitly authorize submission of this version for Reddit review only. This workflow does not install to any subreddit."
        required: true
        type: boolean
        default: false

jobs:
  release:
    if: ${{ inputs.confirm_publish || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && contains(github.event.workflow_run.head_commit.message, '[submit-review:2.0.0]')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require main branch before publishing
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Refusing side effects from non-main ref: $GITHUB_REF"
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify requested release version
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          REQUESTED_VERSION="${REQUESTED_VERSION:-$VERSION}"
          test "$VERSION" = "$REQUESTED_VERSION" || {
            echo "Version mismatch: package.json is $VERSION but requested $REQUESTED_VERSION."
            exit 1
          }
          echo "Preparing infinity-orbs@$VERSION for Reddit review"

      - name: Release preflight
        run: npm run preflight

      - name: Configure Devvit authentication
        env:
          DEVVIT_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
          DEVVIT_SESSION_ID: ${{ secrets.DEVVIT_SESSION_ID }}
        run: |
          set -euo pipefail
          test -n "$DEVVIT_TOKEN"
          test -n "$DEVVIT_SESSION_ID"
          mkdir -p "$HOME/.devvit"
          printf '%s' "$DEVVIT_TOKEN" > "$HOME/.devvit/token"
          printf '%s' "$DEVVIT_SESSION_ID" > "$HOME/.devvit/session-id"
          chmod 600 "$HOME/.devvit/token" "$HOME/.devvit/session-id"

      - name: Verify Devvit authentication
        run: npx devvit whoami

      - name: Submit version for Reddit review
        env:
          CI: true
          DEVVIT_ALLOW_SOURCE_UPLOAD: 1
          REQUESTED_VERSION: ${{ inputs.release_version }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          REQUESTED_VERSION="${REQUESTED_VERSION:-$VERSION}"
          test "$VERSION" = "$REQUESTED_VERSION"
          npx devvit publish --version "$VERSION"

