name: Weighted Roll Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/server/game.ts"
      - "src/shared/roll-batching.ts"
      - "src/client/main.tsx"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/weighted-roll-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weighted-roll-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Node 24 preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run guard, type checks, tests, and production build
        run: npm run preflight
